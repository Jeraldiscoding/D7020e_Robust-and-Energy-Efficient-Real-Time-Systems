[package]
authors = ["Per Lindgren <per.lindgren@ltu.se>"]
edition = "2021"
readme = "README.md"
name = "lab1"
version = "0.1.0"

[lib]
test = false
doctest = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rtic = "1.1.4"
# tracing
rtt-target = { version = "0.6.1" }

# panic handlers
panic-halt = "1.0.0"
panic-rtt-target = { version = "0.2.0" }

# hardware abstraction layer for the nrf42840 
nrf52840-hal = { version = "0.18.0" }

# minimal run-time for cortex-m with stack painting done at boot before user code is executed 
cortex-m-rt = { version = "0.7.5", features = ["paint-stack"] }

# development/debug build with no optimizations
[profile.dev]

# release build with aggressive optimizations
[profile.release]
codegen-units = 1   # better optimizations
incremental = false # better optimizaions
debug = true        # symbols are nice and they don't increase the size on Flash
lto = true          # better optimizations
